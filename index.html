<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Valentina &amp; Mateo · Nos casamos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=IM+Fell+English:ital@0;1&family=Raleway:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{
  --sage:#8a9a7e; --sage-deep:#5f6f54;
  --gold:#c9a96e; --gold-strong:#a8823f;
  --wine:#7a3140; --terracota:#c17b5e; --blush:#c98d94;
  --cream:#fdf8f4; --beige:#f3ece0;
  --text:#3a2e22; --text2:#6b5c47;
  --seal:#5f6f54;
}
body{
  /* ═══ FONDO: subí tu imagen a img/bg-boda.png y cubre toda la pantalla, igual que en la de Natalí ═══ */
  background-color:#efe6d6;
  background-image:url('img/bg-boda.png');
  background-size:cover;
  background-position:center;
  font-family:'Cormorant Garamond',serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;padding:16px;
}
/* velo sutil para que el texto se lea bien encima de cualquier fondo que subas */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(circle at 50% 30%,rgba(253,248,244,.35),rgba(253,248,244,.72) 75%);
}

#petals{position:fixed;inset:0;pointer-events:none;z-index:1;}
.petal{position:absolute;top:-20px;animation:petalFall linear infinite;opacity:0;box-shadow:0 0 6px 1px rgba(255,255,255,.55);}
@keyframes petalFall{
  0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:.7;}
  50%{transform:translateY(50vh) rotate(220deg) translateX(16px);opacity:.5;}
  100%{transform:translateY(108vh) rotate(400deg) translateX(-12px);opacity:0;}
}

.corner{position:fixed;font-size:clamp(26px,5.6vw,38px);opacity:.6;z-index:2;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.12);}
.corner-tl{top:14px;left:16px;color:var(--gold-strong);}
.corner-tr{top:14px;right:16px;transform:scaleX(-1);color:var(--sage-deep);}
.corner-bl{bottom:14px;left:16px;transform:scaleY(-1);color:var(--wine);}
.corner-br{bottom:14px;right:16px;transform:scale(-1);color:var(--gold-strong);}

.ribbon{
  position:relative;z-index:10;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:5px;
  text-transform:uppercase;color:var(--cream);background:linear-gradient(135deg,var(--wine),var(--terracota));
  padding:7px 22px;border-radius:20px;box-shadow:0 6px 18px rgba(122,49,64,.35);
  opacity:0;animation:fadeUp 1s .05s forwards;margin-bottom:10px;font-weight:600;
}

.header-area{text-align:center;margin-bottom:14px;opacity:0;animation:fadeUp 1s .2s forwards;position:relative;z-index:10;}
.header-date{font-family:'Raleway',sans-serif;font-size:clamp(9px,2.5vw,12px);letter-spacing:6px;color:var(--gold-strong);text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.header-names{font-family:'Pinyon Script',cursive;font-size:clamp(50px,14vw,88px);line-height:1.1;
  background:linear-gradient(120deg,var(--wine) 0%,var(--gold-strong) 45%,var(--sage-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 18px rgba(95,111,84,.15);filter:drop-shadow(0 2px 3px rgba(0,0,0,.08));}
.header-amp{font-family:'Playfair Display',serif;font-style:italic;font-size:.5em;color:var(--terracota);margin:0 6px;-webkit-text-fill-color:var(--terracota);}
.header-subtitle{font-family:'Playfair Display',serif;font-size:clamp(13px,3.4vw,18px);color:var(--text2);letter-spacing:5px;margin-top:4px;font-style:italic;text-transform:uppercase;}
.header-divider{width:130px;height:2px;margin:10px auto 0;border-radius:2px;
  background:linear-gradient(90deg,var(--wine),var(--gold-strong),var(--sage-deep));}

.scene{position:relative;width:min(88vw,460px);opacity:0;animation:fadeUp 1s .6s forwards;cursor:pointer;z-index:10;}
.scene-frame{
  position:absolute;inset:-10px -10px auto -10px;top:22%;bottom:-6%;
  border:1.5px solid rgba(168,130,63,.35);border-radius:22px;pointer-events:none;z-index:1;
}
.scene-frame::before,.scene-frame::after{position:absolute;font-size:16px;opacity:.7;content:'❧';}
.scene-frame::before{top:-9px;left:16px;color:var(--wine);}
.scene-frame::after{bottom:-9px;right:16px;color:var(--sage-deep);transform:scale(-1);}

.letter{
  position:absolute;left:13%;width:74%;top:26%;z-index:5;opacity:0;pointer-events:none;
  background:linear-gradient(175deg,var(--cream) 0%,#f7f1e4 100%);
  border-radius:4px;border:1px solid rgba(201,169,110,.4);
  box-shadow:0 -4px 30px rgba(95,111,84,.16),0 2px 14px rgba(0,0,0,.08);
  min-height:56%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:22px 14px 24px;text-align:center;
}
.letter::before{content:'';position:absolute;top:13px;left:13px;right:13px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-strong),transparent);opacity:.5;}
.letter::after{content:'';position:absolute;bottom:13px;left:13px;right:13px;height:1px;background:linear-gradient(90deg,transparent,var(--sage-deep),transparent);opacity:.5;}
.letter-corner{position:absolute;font-size:14px;opacity:.8;line-height:1;}
.letter-corner.tl{top:6px;left:8px;color:var(--wine);} .letter-corner.tr{top:6px;right:8px;color:var(--gold-strong);}
.letter-corner.bl{bottom:6px;left:8px;color:var(--sage-deep);} .letter-corner.br{bottom:6px;right:8px;color:var(--terracota);}
.letter-monogram{font-family:'Playfair Display',serif;font-size:clamp(30px,8vw,44px);font-weight:600;color:var(--gold-strong);line-height:1;text-shadow:0 2px 10px rgba(168,130,63,.28);}
.letter-names{font-family:'Pinyon Script',cursive;font-size:clamp(25px,6.8vw,36px);color:var(--wine);line-height:1;}
.letter-msg{font-family:'IM Fell English',serif;font-size:clamp(12px,3vw,15px);color:var(--text2);letter-spacing:.5px;font-style:italic;line-height:1.6;max-width:90%;}
.letter-date{font-family:'Raleway',sans-serif;font-size:clamp(9px,2.3vw,11px);letter-spacing:4px;color:var(--sage-deep);text-transform:uppercase;margin-top:3px;font-weight:600;}

.envelope-wrap{position:relative;z-index:20;width:100%;}
.envelope-svg{width:100%;display:block;filter:drop-shadow(0 16px 40px rgba(95,111,84,.22));}
.flap{transform-box:fill-box;transform-origin:50% 0%;}

.seal-wrap{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);z-index:25;}
.seal-ring{
  position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(253,248,244,.55);
}
.seal-circle{
  width:clamp(72px,17.5vw,88px);height:clamp(72px,17.5vw,88px);border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#9aae8b,var(--seal) 50%,#3a4432 100%);
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 6px 20px rgba(95,111,84,.4),inset 0 1px 3px rgba(255,255,255,.35);
}
.seal-icon{font-size:clamp(17px,4.4vw,22px);position:relative;z-index:2;color:var(--cream);font-family:'Playfair Display',serif;font-style:italic;letter-spacing:1px;}

@keyframes flapOpen{0%{transform:rotateX(0);}100%{transform:rotateX(-175deg);}}
@keyframes sealPop{0%{transform:translateX(-50%) scale(1);opacity:1;}35%{transform:translateX(-50%) scale(1.18);opacity:.7;}100%{transform:translateX(-50%) scale(0);opacity:0;}}
@keyframes letterRise{0%{transform:translateY(0) scale(.97);opacity:0;}20%{opacity:1;}100%{transform:translateY(-52%) scale(1);opacity:1;}}
@keyframes envelopeExit{to{transform:scale(.88) translateY(16px);opacity:0;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.opening .flap{animation:flapOpen 1.1s .1s cubic-bezier(.4,0,.2,1) forwards;}
.opening .seal-wrap{animation:sealPop .55s .05s ease-in forwards;}
.opening .letter{animation:letterRise 1.4s .9s cubic-bezier(.2,.8,.3,1) forwards;}
.done{animation:envelopeExit .55s .1s ease-in forwards;}
.scene:not(.opening) .seal-wrap{transition:transform .2s;}
.scene:hover:not(.opening) .seal-wrap{transform:translateX(-50%) scale(1.08);}

.tap-hint{margin-top:16px;text-align:center;font-family:'Raleway',sans-serif;font-size:clamp(9px,2.5vw,11px);letter-spacing:4px;color:rgba(107,92,71,.55);text-transform:uppercase;opacity:0;animation:fadeUp .9s 1.2s forwards;position:relative;z-index:10;transition:opacity .3s;}
.footer-text{margin-top:10px;text-align:center;font-family:'IM Fell English',serif;font-size:clamp(15px,3.8vw,20px);font-style:italic;color:var(--wine);opacity:0;animation:fadeUp .9s .9s forwards;position:relative;z-index:10;}
#overlay{position:fixed;inset:0;background:linear-gradient(160deg,#f3ece0,#fdf8f4);opacity:0;pointer-events:none;z-index:100;transition:opacity .65s ease;}
#overlay.fade-in{opacity:1;pointer-events:all;}
</style>
</head>
<body>
<div id="petals"></div>

<div id="overlay"></div>

<div class="corner corner-tl">❧</div>
<div class="corner corner-tr">✦</div>
<div class="corner corner-bl">🌿</div>
<div class="corner corner-br">❧</div>

<p class="ribbon">✦ nos casamos ✦</p>

<div class="header-area">
  <p class="header-date">14 · 11 · 2026</p>
  <h1 class="header-names">Valentina<span class="header-amp">&amp;</span>Mateo</h1>
  <p class="header-subtitle">Nos casamos</p>
  <div class="header-divider"></div>
</div>

<div class="scene" id="scene" onclick="openEnvelope()">
  <div class="scene-frame"></div>
  <div class="letter" id="letter">
    <span class="letter-corner tl">✦</span>
    <span class="letter-corner tr">✦</span>
    <span class="letter-corner bl">✦</span>
    <span class="letter-corner br">✦</span>
    <span class="letter-monogram">V &amp; M</span>
    <span class="letter-names">Valentina y Mateo</span>
    <span class="letter-msg">Nos encantaría que nos acompañes<br/>a celebrar el comienzo<br/>de nuestra nueva vida juntos</span>
    <span class="letter-date">Sábado 14 de Noviembre · 2026</span>
  </div>

  <div class="seal-wrap" id="seal-wrap">
    <div class="seal-ring"></div>
    <div class="seal-circle">
      <svg viewBox="0 0 86 86" style="position:absolute;inset:0;width:100%;height:100%;">
        <defs><path id="cp" d="M43,43 m-31,0 a31,31 0 1,1 62,0 a31,31 0 1,1 -62,0"/></defs>
        <text font-family="Raleway,sans-serif" font-size="6" fill="rgba(253,248,244,0.85)" letter-spacing="1.2">
          <textPath href="#cp" startOffset="2%">Tocá aquí · para ver la invitación ·</textPath>
        </text>
      </svg>
      <span class="seal-icon">V&amp;M</span>
    </div>
  </div>

  <div class="envelope-wrap" id="envelope-wrap">
    <svg class="envelope-svg" viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="envG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8f2e5"/><stop offset="100%" stop-color="#ecdfc7"/>
        </linearGradient>
        <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2ead9"/><stop offset="100%" stop-color="#e4d6bb"/>
        </linearGradient>
        <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(122,49,64,0.14)"/></filter>
      </defs>
      <rect x="14" y="80" width="472" height="288" rx="14" fill="url(#envG)" filter="url(#sh)"/>
      <polygon points="14,80 250,230 14,368" fill="#e0d2b7" opacity=".5"/>
      <polygon points="486,80 250,230 486,368" fill="#e0d2b7" opacity=".5"/>
      <polygon points="14,368 250,248 486,368" fill="#d4c3a2" opacity=".6"/>
      <line x1="14" y1="80" x2="250" y2="230" stroke="rgba(122,49,64,.15)" stroke-width="1"/>
      <line x1="486" y1="80" x2="250" y2="230" stroke="rgba(95,111,84,.15)" stroke-width="1"/>
      <rect x="18" y="84" width="464" height="280" rx="12" fill="none" stroke="rgba(168,130,63,.4)" stroke-width="1.2"/>
      <rect x="24" y="90" width="452" height="268" rx="10" fill="none" stroke="rgba(122,49,64,.16)" stroke-width=".7"/>
      <g class="flap" style="transform-origin:250px 80px;">
        <polygon points="14,82 250,220 486,82" fill="url(#flapG)"/>
        <line x1="14" y1="82" x2="486" y2="82" stroke="rgba(122,49,64,.14)" stroke-width="1"/>
        <line x1="22" y1="89" x2="478" y2="89" stroke="rgba(168,130,63,.35)" stroke-width=".8"/>
      </g>
      <rect x="14" y="80" width="472" height="288" rx="14" fill="none" stroke="rgba(95,111,84,.3)" stroke-width="1.5"/>
      <text x="250" y="310" text-anchor="middle" font-family="'Pinyon Script',cursive" font-size="34" fill="rgba(122,49,64,.3)" transform="rotate(-2,250,310)">Valentina &amp; Mateo</text>
    </svg>
  </div>
</div>

<p class="tap-hint" id="tap-hint">tocá el sobre para abrirlo ✦</p>
<p class="footer-text">¡Nos encantaría contar con vos!</p>

<script>
(function(){
  const c=document.getElementById('petals');
  const formas=[
    {w:8,h:11,br:'50% 40% 55% 35%'},{w:6,h:6,br:'50%'},{w:7,h:2.5,br:'2px'},{w:5,h:5,br:'2px',rot:true}
  ];
  /* paleta variada: dorado, vino, terracota, salvia, blush, crema */
  const cols=['#c9a96e','#a8823f','#7a3140','#c17b5e','#8a9a7e','#5f6f54','#c98d94','#fdf8f4'];
  for(let i=0;i<44;i++){
    const p=document.createElement('div');p.className='petal';
    const f=formas[Math.floor(Math.random()*formas.length)];
    const s=.7+Math.random()*.9;
    p.style.cssText=[
      'left:'+(Math.random()*100)+'vw','width:'+(f.w*s)+'px','height:'+(f.h*s)+'px',
      'background:'+cols[Math.floor(Math.random()*cols.length)],'border-radius:'+f.br,
      'animation-duration:'+(5+Math.random()*8)+'s','animation-delay:'+(-Math.random()*10)+'s'
    ].join(';');
    c.appendChild(p);
  }
})();

let opened=false;
function openEnvelope(){
  if(opened)return; opened=true;
  document.getElementById('tap-hint').style.opacity='0';
  const scene=document.getElementById('scene');
  const letter=document.getElementById('letter');
  const envWrap=document.getElementById('envelope-wrap');
  scene.classList.add('opening');
  setTimeout(()=>{letter.style.zIndex='35';envWrap.style.zIndex='15';},900);
  setTimeout(()=>{
    scene.classList.add('done');
    document.getElementById('overlay').classList.add('fade-in');
    setTimeout(()=>{window.location.href='invitacion.html';},750);
  },3500);
}
</script>
</body>
</html>
